[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "roast-solver-reference"
version = "0.1.0"
description = "NumPy reference implementation for the Roast Solver"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
roast-reference = "roast_solver.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["roast_solver*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
