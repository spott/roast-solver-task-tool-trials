[package]
name = "roast-solver-web-core"
version = "0.1.0"
edition = "2021"
description = "Dependency-light Rust/WASM core for Roast Solver"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Kept in lockstep with the Nix-provided CLI used to generate browser bindings.
wasm-bindgen = "=0.2.126"

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
panic = "abort"
