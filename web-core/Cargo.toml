[package]
name = "roast-solver-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Rust/WASM progressive core for Roast Solver"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.95"

[dev-dependencies]
serde_json = "1.0"
