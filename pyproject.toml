[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roast-solver"
version = "0.1.0"
description = "3-D embedded-boundary roast heat-transfer reference solver"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
roast-solver = "roast_solver.cli:main"

[tool.setuptools.packages.find]
include = ["roast_solver*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
