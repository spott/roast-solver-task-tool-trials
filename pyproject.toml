[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "roast-solver"
version = "0.1.0"
description = "3-D embedded-boundary roast heat-transfer reference solver"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
roast-solver = "roast_solver.cli:main"

[tool.setuptools.packages.find]
include = ["roast_solver*"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["."]
testpaths = ["tests"]
