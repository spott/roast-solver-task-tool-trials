[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roast-solver-reference"
version = "0.1.0"
description = "NumPy reference implementation for the Roast Solver"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[tool.setuptools.packages.find]
include = ["roast_solver*"]
