[package]
name = "roast-solver-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Dependency-light CPU/WASM core for the Roast Solver"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
wasm = ["dep:wasm-bindgen"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Keep this in sync with the wasm-bindgen CLI supplied by nixpkgs in flake.nix.
wasm-bindgen = { version = "=0.2.121", optional = true }

[dev-dependencies]
serde_json = "1"
